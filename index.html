<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLAB Portfolio | THE HAIR EDITORIAL</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       [신규] 부드러운 스크롤 & 고정 헤더에 가려짐 방지 오프셋
       ========================================================================== */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px; /* 상단 메뉴 높이만큼 앵커 포인트 여백 확보 */
    }

    /* 1. 디자인 시스템 정의 */
    :root {
      --blab-bg-vintage: #0b0c0e;       
      --blab-card-bg: #131518;
      --blab-accent-beige: #d4c5b3;     
      --blab-text-pure: #f5f5f7;        
      --blab-text-muted: #868b93;       
      --blab-font-serif: 'Playfair Display', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--blab-bg-vintage);
      color: var(--blab-text-pure);
      overflow-x: hidden;
    }

    /* ==========================================================================
       [신규] 2. 상단 고정(Sticky) 에디토리얼 네비게이션 헤더
       ========================================================================== */
    .blab-header {
      width: 100%;
      padding: 25px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed; /* 항상 상단에 고정 */
      top: 0; left: 0; z-index: 999;
      background: rgba(11, 12, 14, 0.85); /* 반투명 다크 배경 */
      backdrop-filter: blur(12px); /* 뒤가 은은하게 비치는 유리 효과 */
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s ease;
    }

    .blab-logo {
      font-family: var(--blab-font-serif);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-style: italic;
    }
    .blab-logo span { color: var(--blab-accent-beige); font-style: normal; }

    /* 중앙 이동 메뉴 버튼 */
    .blab-nav-menu {
      display: flex;
      gap: 40px;
    }
    .blab-nav-menu a {
      color: var(--blab-text-pure);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.3s;
    }
    .blab-nav-menu a:hover {
      color: var(--blab-accent-beige);
    }

    .blab-nav-badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--blab-accent-beige);
      padding-bottom: 4px;
      color: var(--blab-accent-beige);
    }

    /* 3. 매거진 히어로 섹션 */
    .blab-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 160px 6% 60px 6%; /* 상단 메뉴 높이를 고려해 상단 여백 확장 */
      position: relative;
    }

    .blab-hero-headline {
      font-family: var(--blab-font-serif);
      font-size: clamp(3rem, 9vw, 8rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    
    .blab-hero-headline span {
      display: inline-block;
      opacity: 0;
      transform: translateY(40px);
      animation: revealUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .blab-hero-headline .line-1 { animation-delay: 0.1s; }
    .blab-hero-headline .line-2 { animation-delay: 0.3s; font-style: italic; color: var(--blab-accent-beige); }

    .blab-hero-footer {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: flex-end;
      margin-top: 20px;
    }

    .blab-hero-desc {
      font-size: clamp(1.05rem, 1.8vw, 1.25rem);
      color: var(--blab-text-muted);
      line-height: 1.7;
      max-width: 540px;
    }

    .blab-hero-img-box {
      width: 100%; height: 480px; overflow: hidden; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }
    .blab-hero-img-box img {
      width: 100%; height: 100%; object-fit: cover; transform: scale(1.05); animation: imageZoomOut 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .blab-section-space { padding: 160px 6%; }
    .blab-section-title { font-family: var(--blab-font-serif); font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 400; line-height: 1.3; margin-bottom: 20px; }
    .blab-section-subtitle { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.3em; color: var(--blab-accent-beige); text-transform: uppercase; margin-bottom: 15px; }

    .blab-editorial-statement { max-width: 800px; margin: 0 auto; text-align: center; }
    .blab-editorial-statement p { font-size: 1.1rem; color: var(--blab-text-muted); line-height: 1.8; max-width: 600px; margin: 0 auto; }

    /* 4. 비대칭 룩북 그리드 */
    .blab-lookbook-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 40px; row-gap: 120px; }
    .blab-look-item { position: relative; }
    .item-left-large   { grid-column: 1 / span 6; }
    .item-right-small  { grid-column: 9 / span 5; margin-top: 100px; }
    .item-center-medi  { grid-column: 3 / span 8; }

    .blab-look-thumb { width: 100%; position: relative; overflow: hidden; border-radius: 4px; background: var(--blab-card-bg); }
    .item-left-large .blab-look-thumb  { aspect-ratio: 4 / 5; }
    .item-right-small .blab-look-thumb { aspect-ratio: 2 / 3; }
    .item-center-medi .blab-look-thumb { aspect-ratio: 16 / 10; }

    .blab-look-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .blab-look-item:hover .blab-look-thumb img { transform: scale(1.04); }

    .blab-look-meta { margin-top: 20px; display: flex; justify-content: space-between; align-items: baseline; }
    .blab-look-title { font-family: var(--blab-font-serif); font-size: 1.4rem; font-weight: 400; }
    .blab-look-tag { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--blab-accent-beige); }

    /* 5. 헤어 디렉터 소개 섹션 */
    .blab-directors-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 60px; }
    .blab-director-card { text-align: center; cursor: pointer; }
    .blab-director-img-wrap { width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 4px; margin-bottom: 25px; position: relative; }
    .blab-director-img-wrap img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(1.1); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .blab-director-card:hover .blab-director-img-wrap img { filter: grayscale(0%) contrast(1); transform: scale(1.05); }
    .blab-director-name { font-family: var(--blab-font-serif); font-size: 1.8rem; margin-bottom: 8px; }
    .blab-director-title { font-size: 0.8rem; color: var(--blab-accent-beige); text-transform: uppercase; letter-spacing: 0.15em; }

    /* 6. 프리미엄 스토어 섹션 */
    .blab-store-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; row-gap: 50px; margin-top: 60px; }
    .blab-product-card { background: var(--blab-card-bg); padding: 40px 30px; text-align: center; border-radius: 4px; border: 1px solid rgba(212, 197, 179, 0.05); transition: all 0.4s ease; cursor: pointer; }
    .blab-product-card:hover { transform: translateY(-8px); border-color: rgba(212, 197, 179, 0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .blab-product-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 4px; margin-bottom: 25px; }
    .blab-product-name { font-family: var(--blab-font-serif); font-size: 1.4rem; margin-bottom: 10px; letter-spacing: 0.02em; }
    .blab-product-desc { font-size: 0.9rem; color: var(--blab-text-muted); margin-bottom: 15px; line-height: 1.5; }
    .blab-product-price { font-size: 1.05rem; font-weight: 600; color: var(--blab-text-pure); }
    .blab-store-action { text-align: center; margin-top: 80px; }

    /* 7. 매거진 푸터 락업 & 버튼 */
    .blab-magazine-footer { background: linear-gradient(180deg, transparent, #111215); padding: 160px 6% 100px 6%; text-align: center; border-top: 1px solid rgba(255,255,255,0.03); }
    .blab-magazine-btn { display: inline-block; background: none; color: var(--blab-text-pure); border: 1px solid var(--blab-accent-beige); padding: 20px 45px; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.05em; border-radius: 0; cursor: pointer; text-decoration: none; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .blab-magazine-btn:hover { background: var(--blab-text-pure); color: var(--blab-bg-vintage); border-color: var(--blab-text-pure); transform: translateY(-3px); }

    /* ==========================================================================
       [신규] 8. 스탠다드 비즈니스 정보 푸터
       ========================================================================== */
    .blab-standard-footer {
      background: #07080a;
      padding: 60px 6%;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.8rem;
      color: var(--blab-text-muted);
      line-height: 1.8;
    }

    .blab-footer-info strong {
      display: block;
      color: var(--blab-text-pure);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 15px;
    }

    .blab-footer-info span {
      display: inline-block;
      margin-right: 15px;
    }

    .blab-footer-copyright {
      text-align: right;
    }

    /* 모달 */
    .blab-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 14, 0.97); backdrop-filter: blur(15px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.4s; }
    .blab-modal-overlay.active { opacity: 1; pointer-events: auto; }
    .blab-modal-box { width: 90%; max-width: 500px; background: var(--blab-card-bg); border: 1px solid rgba(212, 197, 179, 0.2); padding: 40px; transform: translateY(30px); transition: transform 0.4s; }
    .blab-modal-overlay.active .blab-modal-box { transform: translateY(0); }
    .blab-modal-close { position: absolute; top: 20px; right: 25px; background: none; border: none; color: var(--blab-text-muted); font-size: 2rem; cursor: pointer; }
    .blab-modal-close:hover { color: white; }
    .blab-form-group { margin-bottom: 20px; }
    .blab-form-label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--blab-accent-beige); margin-bottom: 8px; letter-spacing: 0.1em; text-transform: uppercase; }
    .blab-form-input { width: 100%; background: #0b0c0e; border: 1px solid rgba(255,255,255,0.08); padding: 14px; color: white; font-size: 0.95rem; outline: none; transition: border 0.3s; }
    .blab-form-input:focus { border-color: var(--blab-accent-beige); }

    /* 스크롤 Reveal */
    .blab-reveal { opacity: 0; transform: translateY(40px); transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .blab-reveal.active { opacity: 1; transform: translateY(0); }
    @keyframes revealUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes imageZoomOut { to { transform: scale(1); } }

    /* 반응형 패치 */
    @media (max-width: 1024px) {
      .blab-lookbook-grid { gap: 30px; row-gap: 80px; }
      .item-left-large, .item-right-small, .item-center-medi { grid-column: span 12; margin-top: 0; }
      .blab-hero-footer { grid-template-columns: 1fr; gap: 30px; }
      .blab-hero-img-box { height: 380px; }
      .blab-directors-grid, .blab-store-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .blab-header { padding: 20px 6%; }
      .blab-logo { font-size: 1.2rem; }
      .blab-nav-badge { display: none; /* 모바일에서는 메뉴 공간 확보를 위해 우측 배지 숨김 처리 */ }
      .blab-nav-menu { gap: 20px; }
      
      .blab-hero { padding: 140px 6% 40px 6%; }
      .blab-section-space { padding: 90px 6%; }
      .blab-card { padding: 20px; }
      .blab-look-title { font-size: 1.2rem; }
      .blab-look-meta { margin-top: 12px; }
      .blab-magazine-footer { padding: 100px 6% 60px 6%; }
      .blab-modal-box { padding: 30px 20px; width: 95%; }
      .blab-directors-grid, .blab-store-grid { grid-template-columns: 1fr; }
      
      /* 모바일 푸터 세로 정렬 */
      .blab-standard-footer { flex-direction: column; gap: 30px; text-align: center; align-items: center; }
      .blab-footer-info span { display: block; margin-right: 0; margin-bottom: 5px; }
      .blab-footer-copyright { text-align: center; }
    }
  </style>
</head>
<body>
